<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Racer: Mental Duel</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="game-wrapper">
        
        <div class="hud-panel">
            <div id="p1Score" class="score p1">P1: 0m</div>
            <div id="timerDisplay" class="timer-box">60s</div>
            <div id="p2Score" class="score p2">P2: 0m</div>
        </div>

        <div class="game-container">
            
            <div class="math-overlay p1-overlay">
                <div class="math-group">
                    <div class="math-box left">
                        <span class="label">MOVE LEFT</span>
                        <span class="problem" id="p1-txt-left">0 + 0</span>
                    </div>
                    <div class="math-box right">
                        <span class="label">MOVE RIGHT</span>
                        <span class="problem" id="p1-txt-right">0 + 0</span>
                    </div>
                </div>
                <div class="key-hint">USE TOP ROW NUMBERS</div>
            </div>

            <div class="math-overlay p2-overlay">
                <div class="math-group">
                    <div class="math-box left">
                        <span class="label">MOVE LEFT</span>
                        <span class="problem" id="p2-txt-left">0 + 0</span>
                    </div>
                    <div class="math-box right">
                        <span class="label">MOVE RIGHT</span>
                        <span class="problem" id="p2-txt-right">0 + 0</span>
                    </div>
                </div>
                <div class="key-hint">USE NUMPAD</div>
            </div>

            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div id="uiLayer" class="ui-layer hidden">
                <div class="glass-panel">
                    <h1 id="winnerText">TIME UP!</h1>
                    <p id="finalScores" class="winner-result"></p>
                    
                    <div class="modal-btn-group">
                        <button id="btnRetry">PLAY AGAIN</button>
                        <button id="btnExit">EXIT</button>
                    </div>
                </div>
            </div>

        </div> <a href="/" class="quit-btn">✕ ABORT RACE</a>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
