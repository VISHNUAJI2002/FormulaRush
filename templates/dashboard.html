{% extends "base.html" %}

{% block content %}
<style>
    /* --- GARAGE SYSTEM STYLES (ADDED) --- */
    .garage-modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }
    .garage-modal-overlay.active { display: flex; }
    .garage-container {
        background: #0a0a12;
        border: 2px solid #00f260;
        box-shadow: 0 0 20px rgba(0, 242, 96, 0.2);
        border-radius: 15px;
        padding: 20px;
        width: 90%;
        max-width: 800px;
        text-align: center;
        position: relative;
    }
    .garage-header {
        font-size: 2rem;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 20px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #00f260;
    }
    .garage-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .car-card {
        background: #1a1a24;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 15px;
        width: 160px;
        height: 240px; /* Fixed height for alignment */
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        
        /* Flex alignment to fix jumping text */
        display: flex;
        flex-direction: column;
        justify-content: space-between; 
        align-items: center;
    }
    .car-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .car-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }
    .car-card.selected { border: 2px solid #00f260; box-shadow: 0 0 15px rgba(0, 242, 96, 0.4); }
    
    .car-preview { 
        width: 100%; 
        height: 140px; 
        object-fit: contain; /* Prevents stretching */
        object-position: center;
        margin-bottom: 10px; 
        filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
    }
    
    .car-name { color: #fff; font-size: 0.9rem; margin-bottom: 5px; font-weight: bold; }
    .unlock-req { color: #ff4b2b; font-size: 0.7rem; font-weight: bold; }
    .lock-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        font-size: 2rem; color: #ff4b2b; text-shadow: 0 0 5px #000;
        display: none;
    }
    .car-card.locked .lock-overlay { display: flex; }
    .btn-close-garage {
        margin-top: 20px;
        background: transparent;
        border: 1px solid #fff;
        color: #fff;
        padding: 10px 30px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }
    .btn-close-garage:hover { background: #fff; color: #000; }

/* --- PREMIUM RACE PROTOCOL STYLES (FIXED) --- */
    .protocol-container {
        max-width: 550px !important;
        background: radial-gradient(circle at top, #1a1a24, #0a0a12) !important;
        /* RESTORED NEON BORDER */
        border: 2px solid #00f260 !important;
        box-shadow: 0 0 30px rgba(0, 242, 96, 0.2) !important;
    }

    .protocol-label {
        color: #888;
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 10px;
        display: block;
        text-align: center;
    }

    .tech-toggle-group {
        display: flex;
        justify-content: center;
        background: #050508;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 4px;
        margin: 0 auto 30px auto;
        width: fit-content;
    }

    .btn-tech-opt {
        background: transparent;
        border: none;
        color: #666;
        padding: 10px 25px;
        font-family: inherit;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 2px;
        letter-spacing: 1px;
    }

    .btn-tech-opt:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }

    .btn-tech-opt.active {
        background: #00f260;
        color: #000;
        box-shadow: 0 0 20px rgba(0, 242, 96, 0.3);
    }

    /* CUSTOM INPUT WRAPPER (To show 's') */
    .custom-input-wrapper {
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: baseline;
        margin-bottom: 20px;
    }
    .custom-input-tech {
        background: transparent;
        border: none;
        border-bottom: 2px solid #00f260;
        color: #fff;
        font-size: 2rem;
        text-align: right; /* Align number to right */
        width: 80px;
        font-family: monospace;
        padding-right: 5px;
    }
    .custom-input-tech:focus { outline: none; }
    .input-unit {
        color: #00f260;
        font-size: 1.5rem;
        font-weight: bold;
        margin-left: 5px;
    }

    /* ACTION BUTTONS */
    .btn-action-primary {
        width: 100%; 
        padding: 15px;
        background: linear-gradient(90deg, #00f260, #00b347);
        border: none;
        color: #000;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .btn-action-primary:hover { filter: brightness(1.1); box-shadow: 0 0 30px rgba(0, 242, 96, 0.4); }

    .btn-action-secondary {
        margin-top: 15px;
        background: transparent;
        border: 1px solid #444;
        color: #666;
        padding: 10px 20px;
        font-size: 0.8rem;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.2s;
        text-transform: uppercase;
    }
    .btn-action-secondary:hover { border-color: #fff; color: #fff; }

/* --- ERROR MESSAGE STYLE --- */
    .error-display {
        color: #ff4b2b;
        font-family: monospace;
        font-size: 0.85rem;
        margin-top: 15px;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(255, 75, 43, 0.6);
        display: none; /* Hidden by default */
        animation: flashError 0.5s ease-in-out;
    }

    @keyframes flashError {
        0% { opacity: 0; transform: translateY(-5px); }
        100% { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="dashboard-container">
    <div class="profile-card">
        
        <div class="pilot-header">
            <h1 class="pilot-name">{{ current_user.username }}</h1>
            <div class="pilot-rank">Formula Rush Pilot</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Career Personal Best</div>
                <div class="stat-value">
                    {{ score if score else 0 }}<span class="stat-unit">m</span>
                </div>
            </div>
        </div>

        <div class="mode-select-container" style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px;">
            
            <a href="{{ url_for('single_player') }}" class="btn btn-primary btn-large"style="width: 100%; display: block; background: linear-gradient(90deg, #00f260, #0575e6); border: none;">
                <div style="font-size: 1.2rem; font-weight: bold;">🏎️ SINGLE PLAYER</div>
                <div style="font-size: 0.8rem; opacity: 0.9; font-weight: normal; letter-spacing: 1px;">5-LANE SURVIVAL MODE</div>
            </a>

            <button id="btn-multiplayer" class="btn btn-primary btn-large" style="width: 100%; display: block; background: linear-gradient(90deg, #1cb5e0, #000851); border: none; cursor: pointer;">
                <div style="font-size: 1.2rem; font-weight: bold;">🌐 MULTIPLAYER</div>
                <div style="font-size: 0.8rem; opacity: 0.9; font-weight: normal; letter-spacing: 1px;">RACE AGAINST RIVALS</div>
            </button>

            <button id="btn-garage" class="btn btn-primary btn-large" style="width: 100%; display: block; background: linear-gradient(90deg, #ff0099, #493240); border: none; cursor: pointer;">
                <div style="font-size: 1.2rem; font-weight: bold;">🔧 GARAGE</div>
                <div style="font-size: 0.8rem; opacity: 0.9; font-weight: normal; letter-spacing: 1px;">UNLOCK & CUSTOMIZE</div>
            </button>

        </div>

    </div>
</div>

<div id="garage-modal" class="garage-modal-overlay">
    <div class="garage-container">
        <div class="garage-header">SHOWROOM</div>
        <div class="garage-grid" id="garage-grid">
            </div>
        <button id="close-garage" class="btn-close-garage">PREPARE FOR RACE</button>
    </div>
</div>

<div id="multiplayer-modal" class="garage-modal-overlay">
    <div class="garage-container protocol-container">
        
        <div class="garage-header" style="font-size: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 15px;">
            RACE CONFIGURATION
        </div>
        
        <div style="padding: 20px 0;">
            <span class="protocol-label">TIME LIMIT</span>

            <div class="tech-toggle-group">
                <button class="btn-tech-opt active" onclick="selectTime(60, this)">60s</button>
                <button class="btn-tech-opt" onclick="selectTime(90, this)">90s</button>
                <button class="btn-tech-opt" onclick="selectTime(120, this)">120s</button>
                <button class="btn-tech-opt" onclick="toggleCustomTime(this)">CUSTOM</button>
            </div>

            <div id="custom-wrapper" class="custom-input-wrapper">
                <input type="number" id="custom-time" class="custom-input-tech" placeholder="00" min="30" max="600">
                <span class="input-unit">s</span>
            </div>

            <div id="multi-error-msg" class="error-display"></div>
        </div>

        <button id="btn-initiate-multi" class="btn-action-primary">
            INITIATE SEQUENCE
        </button>

        <button id="close-multi" class="btn-action-secondary">
            CANCEL OPERATION
        </button>
    </div>
</div>

<script>
    /* --- GARAGE LOGIC --- */
    // Updated with Real World Names
    const CAR_DB = [
        { id: 'car_default', name: 'Crown Vic',       img: 'car_default.png', unlockScore: 0 },
        { id: 'car_bronze',  name: 'Continental GT',  img: 'car_bronze.png',  unlockScore: 500 },
        { id: 'car_silver',  name: '300 SL Roadster', img: 'car_silver.png',  unlockScore: 1000 },
        { id: 'car_gold',    name: 'Nissan Skyline GT-R',    img: 'car_gold.png',    unlockScore: 2000 }
    ];

    const btnGarage = document.getElementById('btn-garage');
    const modalGarage = document.getElementById('garage-modal');
    const btnCloseGarage = document.getElementById('close-garage');
    const gridGarage = document.getElementById('garage-grid');

    function initGarage() {
        // --- CRITICAL FIX: TRUST SERVER SCORE ONLY ---
        // We inject the Jinja2 variable directly into JS.
        // This ensures the Garage sees the ACCOUNT score, not the Browser Cache score.
        const serverScore = {{ score if score else 0 }};
        
        // SYNC: Update localStorage so the game engine (single_script.js) knows the real score too
        localStorage.setItem('formulaRush_highScore', serverScore);

        const highScore = serverScore;
        let currentSelection = localStorage.getItem('formulaRush_selectedCar') || 'car_default';
        
        // --- SECURITY CHECK: REVOKE ILLEGAL CARS ---
        // If user has a high-tier car selected but their score is too low (new account), reset them.
        const selectedCarObj = CAR_DB.find(c => c.id === currentSelection);
        if (selectedCarObj && highScore < selectedCarObj.unlockScore) {
            console.log("Detected illegal car selection. Revoking access.");
            currentSelection = 'car_default';
            localStorage.setItem('formulaRush_selectedCar', 'car_default');
        }

        gridGarage.innerHTML = ''; // Clear current

        CAR_DB.forEach(car => {
            const isLocked = highScore < car.unlockScore;
            const isSelected = currentSelection === car.id;
            
            const card = document.createElement('div');
            card.className = `car-card ${isLocked ? 'locked' : ''} ${isSelected ? 'selected' : ''}`;
            
            // Only allow click if unlocked
            card.onclick = () => { if(!isLocked) selectCar(car.id); };

            const imgPath = `/static/${car.img}`;
            
            card.innerHTML = `
                <div class="lock-overlay">🔒</div>
                <img src="${imgPath}" class="car-preview" alt="${car.name}">
                <div class="car-name">${car.name}</div>
                <div class="unlock-req">${isLocked ? 'UNLOCK: ' + car.unlockScore + 'm' : 'UNLOCKED'}</div>
            `;
            gridGarage.appendChild(card);
        });
    }

    function selectCar(carId) {
        localStorage.setItem('formulaRush_selectedCar', carId);
        initGarage(); // Re-render to update selection UI
    }

    btnGarage.addEventListener('click', () => {
        initGarage();
        modalGarage.classList.add('active');
    });

    btnCloseGarage.addEventListener('click', () => {
        modalGarage.classList.remove('active');
    });

/* --- MULTIPLAYER MODAL LOGIC (FINAL WITH ERROR HANDLING) --- */
    const btnMulti = document.getElementById('btn-multiplayer');
    const modalMulti = document.getElementById('multiplayer-modal');
    const closeMulti = document.getElementById('close-multi');
    const btnStartMulti = document.getElementById('btn-initiate-multi');
    
    // IDs
    const customInput = document.getElementById('custom-time');
    const customWrapper = document.getElementById('custom-wrapper');
    const errorDisplay = document.getElementById('multi-error-msg'); // New Error Ref
    
    let selectedDuration = 60; // Default

    // Open Modal
    btnMulti.addEventListener('click', () => {
        modalMulti.classList.add('active');
        errorDisplay.style.display = 'none'; // Clear errors on open
    });

    // Close Modal
    closeMulti.addEventListener('click', () => {
        modalMulti.classList.remove('active');
    });

    // Helper: Reset buttons
    function resetActiveButtons() {
        const allButtons = document.querySelectorAll('.tech-toggle-group button');
        allButtons.forEach(b => b.classList.remove('active'));
    }

    // Time Selection Logic
    window.selectTime = function(seconds, btn) {
        selectedDuration = seconds;
        customWrapper.style.display = 'none';
        errorDisplay.style.display = 'none'; // Clear error
        
        resetActiveButtons();
        btn.classList.add('active');
    };

    // Custom Time Logic
    window.toggleCustomTime = function(btn) {
        resetActiveButtons();
        btn.classList.add('active');
        
        customWrapper.style.display = 'flex';
        customInput.focus();
        selectedDuration = 'custom';
        errorDisplay.style.display = 'none'; // Clear error
    };

    // Start Game Redirect
    btnStartMulti.addEventListener('click', () => {
        let finalTime = selectedDuration;

        // If custom is selected, validate input
        if (selectedDuration === 'custom') {
            const val = parseInt(customInput.value);
            
            // CHECK 1: Valid Number and Minimum
            if (!val || val < 30) { 
                errorDisplay.innerText = "⚠ SYSTEM ERROR: MINIMUM DURATION IS 30s";
                errorDisplay.style.display = 'block';
                return; 
            }
            
            // CHECK 2: Maximum Limit
            if (val > 600) {
                errorDisplay.innerText = "⚠ SYSTEM ERROR: MAXIMUM DURATION IS 600s";
                errorDisplay.style.display = 'block';
                return;
            }
            
            finalTime = val;
        }

        // Redirect to game with duration parameter
        window.location.href = "{{ url_for('play') }}?duration=" + finalTime;
    });
</script>
{% endblock %}
