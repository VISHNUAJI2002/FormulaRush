{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="auth-title" style="color: var(--neon-pink);">New License</h2>
        
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Choose Callsign (Username)</label>
                <input type="text" name="username" class="form-input" placeholder="PILOT NAME" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Set Security Code (Password)</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; border-color: var(--neon-pink); color: var(--neon-pink);">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="/login" style="color: var(--neon-pink);">Login Here</a>
        </div>
    </div>
</div>
{% endblock %}
