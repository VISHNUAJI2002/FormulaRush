{% extends "base.html" %}

{% block content %}
<style>
    /* --- COCKPIT UI STYLES --- */
    body {
        overflow: hidden; /* Prevent scrolling completely */
        background-color: #1a1a2e;
    }

    .cockpit-body {
        /* Fix the container to the viewport to ensure perfect centering */
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        
        /* Flexbox Centering */
        display: flex;
        justify-content: center;
        align-items: center;
        
        color: #eee;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
        z-index: 10; /* Ensure it sits above background elements */
        
        /* Add a small padding-top to account for visual navbar offset if needed */
        padding-top: 20px; 
    }

    /* SCALE WRAPPER: Handles the Zoom */
    .game-transform-wrapper {
        transform-origin: center center;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        
        /* ENLARGE: Set default scale larger */
        transform: scale(1.05); 
    }

    .game-wrapper {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 25px; /* Increased gap slightly for better look */
        padding: 20px;
    }

    /* --- LEFT PANEL: CONTROLS --- */
    .control-panel {
        width: 310px; /* Wider */
        background: #1c1c1c;
        padding: 25px;
        border-radius: 12px;
        border: 4px solid #333;
        box-shadow: 10px 10px 30px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 600px; /* Match Game Height */
        justify-content: space-between; /* Distribute items evenly */
    }

    .panel-divider {
        width: 100%; height: 2px; background: #333; margin: 10px 0;
        box-shadow: 0 1px 0 #000;
    }

    .control-label {
        font-weight: bold; color: #888; text-transform: uppercase;
        letter-spacing: 2px; margin-bottom: 10px; font-size: 0.8rem;
        text-align: center; width: 100%;
    }

    /* --- SHIFTER --- */
    .shifter-container {
        position: relative; width: 140px; height: 220px;
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        border-radius: 10px; border: 4px solid #444;
        box-shadow: inset 0 0 15px #000; 
        display: flex; justify-content: center;
        overflow: hidden; /* Fixes white line */
    }
    .shifter-slot {
        width: 12px; height: 180px; background: #000;
        border-radius: 10px; margin-top: 20px;
        box-shadow: inset 0 0 5px rgba(0,0,0,1); position: relative; z-index: 1;
    }
    .shifter-labels { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .shift-mark {
        position: absolute; left: 15px; font-family: sans-serif;
        font-weight: 800; font-size: 0.7rem; color: #444; text-transform: uppercase;
        transition: color 0.3s;
    }
    .mark-3 { top: 35px; } .mark-2 { top: 95px; } .mark-1 { top: 155px; }
    .active-label { text-shadow: 0 0 10px currentColor; }

    .shifter-stick-assembly {
        position: absolute; top: 150px; left: 50%;
        transform: translate(-50%, -50%); width: 70px; height: 70px; z-index: 10;
        transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none;
    }
    .shifter-rod {
        position: absolute; top: 50%; left: 50%; width: 8px; height: 100px;
        background: linear-gradient(90deg, #888, #fff, #888); transform: translate(-50%, 0); z-index: -1;
    }
    .shifter-knob {
        width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #444, #111);
        border-radius: 50%; border: 2px solid #555; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        display: flex; justify-content: center; align-items: center;
    }
    .knob-number {
        font-size: 1.8rem; font-weight: 900; color: #333; font-family: 'Courier New', monospace; transition: all 0.3s;
    }
    .click-zone { position: absolute; left: 0; width: 100%; height: 70px; cursor: pointer; z-index: 20; }
    .zone-3 { top: 5px; } .zone-2 { top: 75px; } .zone-1 { top: 145px; }


    /* --- SWITCHES --- */
    .rocker-group { display: flex; gap: 15px; justify-content: center; width: 100%; }
    .rocker-input { display: none; }
    .rocker-label {
        width: 80px; height: 50px;
        background: linear-gradient(to bottom, #222, #333);
        border-top: 2px solid #555; border-bottom: 2px solid #111;
        border-radius: 4px; position: relative; cursor: pointer;
        box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center; transition: all 0.1s;
    }
    .rocker-light {
        width: 15px; height: 5px; background: #333; margin-bottom: 5px;
        box-shadow: inset 0 0 2px #000; transition: all 0.3s;
    }
    .rocker-text { font-size: 0.6rem; font-weight: bold; color: #666; text-transform: uppercase;}
    .rocker-input:checked + .rocker-label {
        background: linear-gradient(to bottom, #111, #222);
        border-top: 2px solid #000; border-bottom: 2px solid #444; transform: translateY(2px);
    }
    .rocker-input:checked + .rocker-label .rocker-light { background: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
    .rocker-input:checked + .rocker-label .rocker-text { color: #eee; }
    #math-mixed:checked + .rocker-label .rocker-light { background: #d63384; box-shadow: 0 0 8px #d63384; }


    /* --- IGNITION --- */
    .button-group {
        display: flex; width: 100%; justify-content: space-around; align-items: center;
        margin-top: 15px;
    }
    .start-btn {
        width: 90px; height: 90px;
        border-radius: 50%; background: radial-gradient(circle at 30% 30%, #b00, #500);
        border: 4px solid #ccc; box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
        color: #fff; font-weight: bold; font-size: 0.8rem; text-align: center;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        cursor: pointer; text-transform: uppercase; text-shadow: 0 1px 2px #000; transition: all 0.1s;
    }
    .start-btn span { font-size: 1.2rem; display: block; margin-bottom: -4px; }
    .start-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .start-btn.btn-disabled { filter: grayscale(80%) brightness(50%); pointer-events: none; cursor: not-allowed; }

    .stop-btn {
        width: 90px; height: 90px;
        background: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #222 10px, #222 20px);
        border: 3px solid #222; border-radius: 8px; display: flex; justify-content: center; align-items: center;
        cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.8); transition: all 0.1s;
    }
    .stop-btn-inner {
        width: 60px; height: 60px; background: #c0392b; border-radius: 4px; border: 2px solid #800;
        box-shadow: inset 0 0 10px #000; color: white; font-weight: bold; font-size: 0.7rem;
        display: flex; justify-content: center; align-items: center; text-align: center; text-transform: uppercase;
    }
    .stop-btn:active { transform: scale(0.95); }
    .stop-btn.btn-disabled { opacity: 0.3; filter: grayscale(100%); pointer-events: none; cursor: not-allowed; }


    /* --- CENTER: GAME --- */
    .game-container {
        position: relative;
        border: 4px solid #00d2ff;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0, 210, 255, 0.2);
        background: #000;
        width: 800px; height: 600px;
        flex-shrink: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .math-overlay {
        position: absolute; top: 20px;
        font-size: 28px; font-weight: 800; color: white;
        background: rgba(0, 0, 0, 0.8); padding: 8px 16px;
        border-radius: 8px; border: 2px solid #00d2ff; z-index: 10;
    }
    #question-left { left: 20px; }
    #question-right { right: 20px; }

    #game-over-screen {
        display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); flex-direction: column;
        justify-content: center; align-items: center; z-index: 20;
    }

    /* --- RIGHT PANEL: HUD --- */
    .hud-panel {
        width: 250px; /* Wider */
        background: #1c1c1c; padding: 20px;
        border-radius: 12px; border: 2px solid #333;
        display: flex; flex-direction: column; align-items: center;
        box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
        height: 600px; /* Match Game Height */
        justify-content: center; /* Center content vertically */
        gap: 40px;
    }
    .digital-display {
        background: #000; border: 2px solid #555; border-radius: 6px;
        padding: 10px; width: 100%; text-align: center;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .digital-label { color: #888; font-size: 0.8rem; text-transform: uppercase; display: block;}
    .digital-value { color: #00d2ff; font-size: 2rem; font-family: 'Courier New', monospace; font-weight: bold; }

    /* GAUGE CSS */
    .gauge-wrapper {
        position: relative; width: 200px; height: 200px;
        background: radial-gradient(#222, #000); border-radius: 50%;
        border: 4px solid #555; margin-top: 10px;
    }
    .gauge-arc {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%;
        background: conic-gradient(from 225deg, #28a745 0deg, #ffc107 135deg, #dc3545 270deg, transparent 270deg);
        -webkit-mask: radial-gradient(transparent 65%, black 65%); mask: radial-gradient(transparent 65%, black 65%);
    }
    .gauge-needle {
        position: absolute; top: 50%; left: 50%; width: 45%; height: 4px;
        background: #ff4b2b; transform-origin: 0% 50%; transform: rotate(225deg);
        transition: transform 0.1s linear; border-radius: 50%; z-index: 5; box-shadow: 0 0 5px red;
    }
    .gauge-value {
        position: absolute; bottom: 50px; left: 0; right: 0; text-align: center;
        color: white; font-size: 2.2rem; font-weight: bold; z-index: 6;
    }
    .gauge-unit { font-size: 1rem; color: #888; display: block; margin-top: -2px; }

    /* --- RESPONSIVE SCALING --- */
    /* Only shrink if screen height is actually small */
    @media (max-height: 800px) {
        .game-transform-wrapper { transform: scale(0.9); }
    }
    @media (max-height: 700px) {
        .game-transform-wrapper { transform: scale(0.8); }
    }
    @media (max-width: 1400px) {
        /* If screen is narrow, also shrink slightly to fit width */
        .game-transform-wrapper { transform: scale(0.9); }
    }

</style>

<div class="cockpit-body">
    <div class="game-transform-wrapper">
        <div class="game-wrapper">

            <div class="control-panel">
                
                <div id="settings-area">
                    <span class="control-label">Transmission</span>
                    <div class="shifter-container">
                        <div class="shifter-slot"></div>
                        <div class="shifter-labels">
                            <div class="shift-mark mark-3" id="label-hard">Hard</div>
                            <div class="shift-mark mark-2" id="label-medium">Medium</div>
                            <div class="shift-mark mark-1 active-label" id="label-easy">Easy</div>
                        </div>
                        <div class="click-zone zone-3" onclick="shiftGear('hard')"></div>
                        <div class="click-zone zone-2" onclick="shiftGear('medium')"></div>
                        <div class="click-zone zone-1" onclick="shiftGear('easy')"></div>
                        <div class="shifter-stick-assembly" id="shifter-assembly">
                            <div class="shifter-knob">
                                <span class="knob-number" id="knob-number" style="color:#00d2ff; text-shadow:0 0 15px #00d2ff;">1</span>
                            </div>
                            <div class="shifter-rod"></div>
                        </div>
                    </div>

                    <div class="panel-divider"></div>

                    <span class="control-label">Nav Computer</span>
                    <div class="rocker-group">
                        <div class="rocker-wrapper">
                            <input type="radio" name="math" id="math-simple" value="simple" class="rocker-input" checked>
                            <label for="math-simple" class="rocker-label">
                                <div style="text-align:center;">
                                    <div class="rocker-light"></div>
                                    <div class="rocker-text">Add / Sub</div>
                                </div>
                            </label>
                        </div>

                        <div class="rocker-wrapper">
                            <input type="radio" name="math" id="math-mixed" value="mixed" class="rocker-input">
                            <label for="math-mixed" class="rocker-label">
                                <div style="text-align:center;">
                                    <div class="rocker-light"></div>
                                    <div class="rocker-text">All Operations</div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div> <div class="panel-divider"></div>

                <div style="width:100%">
                    <span class="control-label">Ignition System</span>
                    <div class="button-group">
                        <div id="btn-start" class="start-btn">
                            <span>Start</span>Engine
                        </div>
                        <div id="btn-stop" class="stop-btn btn-disabled">
                            <div class="stop-btn-inner">
                                KILL<br>SWITCH
                            </div>
                        </div>
                    </div>
                </div>
                
                <a href="{{ url_for('dashboard') }}" style="display:block; text-align:center; margin-top:10px; color:#555; text-decoration:none; font-size:0.8rem;">&larr; Exit to Hangar</a>
            </div>


            <div class="game-container">
                <div id="question-left" class="math-overlay">L: --</div>
                <div id="question-right" class="math-overlay">R: --</div>

                <canvas id="gameCanvas" width="800" height="600"></canvas>

                <div id="game-over-screen">
                    <h1 id="game-over-title" style="color:#ff4b2b;">CRITICAL FAILURE</h1>
                    <p style="font-size: 1.5rem; color:#ccc;">Distance Traveled: <span id="final-score">0</span>m</p>
                    <button onclick="location.reload()" class="btn btn-primary btn-lg" style="margin-top:20px;">REBOOT SYSTEM</button>
                </div>
            </div>

            <div class="hud-panel">
                <div style="width:100%">
                    <span class="control-label">Odometer</span>
                    <div class="digital-display">
                        <div class="digital-value"><span id="live-distance">0</span>m</div>
                    </div>
                </div>

                <div>
                    <span class="control-label">Velocity</span>
                    <div class="gauge-wrapper">
                        <div class="gauge-arc"></div>
                        <div class="gauge-needle" id="speed-needle"></div>
                        <div class="gauge-value">
                            <span id="speed-value">0</span>
                            <span class="gauge-unit">KM/H</span>
                        </div>
                    </div>
                </div>
            </div>

        </div> </div> </div>

<script src="{{ url_for('static', filename='single_script.js') }}"></script>

{% endblock %}
