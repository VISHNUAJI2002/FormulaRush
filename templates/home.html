{% extends "base.html" %}

{% block content %}
<div class="hero-container">
    <div class="glass-panel hero-content">
        <h1 class="hero-title">FORMULA <span class="neon-text">RUSH</span></h1>
        
        <p class="hero-tagline">The Ultimate Split-Screen Mental Duel</p>
        
        <div class="hero-description">
            <p>Solve Math. Dodge Traffic. Survive.</p>
        </div>

        <div class="hero-actions">
            {% if current_user.is_authenticated %}
                <a href="/dashboard" class="btn btn-primary btn-large">Go to Paddock</a>
            {% else %}
                <a href="/register" class="btn btn-primary btn-large">Start Engine</a>
                <a href="/login" class="btn btn-text">Already a Pilot? Login</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
