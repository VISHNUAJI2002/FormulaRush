<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Rush</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a class="brand" href="/">🏎️ Formula Rush</a>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <span class="user-greeting">Pilot: {{ current_user.username }}</span>
                <a href="/dashboard" class="btn btn-primary">Dashboard</a>
                <a href="#" onclick="localStorage.removeItem('formulaRushConfig'); window.location.href='/logout';" class="btn btn-danger">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-text">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
